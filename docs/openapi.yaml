      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /website/content/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Website]
      summary: Publish website content
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /website/content/{id}/unpublish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Website]
      summary: Unpublish website content
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /website/content/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Website]
      summary: Archive website content
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /website/content/stats:
    get:
      tags: [Website]
      summary: Website dashboard counts per content type and status (publicPages update)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /website/uploads:
    post:
      tags: [Website]
      summary: Upload one website picture or document (publicPages create)
      description: >
        Multipart field "file". JPG, PNG, WEBP, PDF, DOC, DOCX, XLSX, PPT, PPTX or TXT up to 10 MB; the file's
        content must match its type. Returns { url, name, mimeType, sizeBytes, kind } to place on content.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /website/files/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{24}\.(jpg|jpeg|png|webp|pdf|doc|docx|xlsx|ppt|pptx|txt)$' }
    get:
      tags: [Website]
      summary: Download an uploaded website file (public)
      security: []
      responses:
        '200':
          description: The file. Pictures and PDFs are shown inline; other files are sent as downloads.
        default: { $ref: '#/components/responses/DefaultError' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: icms.sid
      description: Session cookie set by `POST /auth/login`.
    gatewaySignature:
      type: apiKey
      in: header
      name: x-razorpay-signature
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    RoleKey:
      name: roleKey
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Format:
      name: format
      in: query
      schema: { type: string, enum: [json, csv, pdf] }
    PurposeQuery:
      name: purpose
      in: query
      schema: { type: string, enum: [admission, exam] }
    ProgramIdQuery:
      name: programId
      in: query
      schema: { type: string }
    SemesterQuery:
      name: semester
      in: query
      schema: { type: integer, minimum: 1 }
    AcademicYearIdQuery:
      name: academicYearId
      in: query
      schema: { type: string }
    ExamIdQuery:
      name: examId
      in: query
      schema: { type: string }
    StudentIdQuery:
      name: studentId
      in: query
      schema: { type: string }
    SubjectIdQuery:
      name: subjectId
      in: query
      schema: { type: string }
  responses:
    Ok:
      description: Successful JSON response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Created:
      description: Created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Pdf:
      description: PDF download
      content:
        application/pdf:
          schema: { type: string, format: binary }
    Conflict:
      description: Business rule conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DefaultError:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { description: Endpoint-specific payload }
        meta:
          type: object
          properties:
            requestId: { type: string }
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    ErrorResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items: { type: object }
    Ref:
      type: object
      properties:
        _id: { type: string }
        id: { type: string }
        name: { type: string }
        code: { type: string }
        label: { type: string }
    Object:
      type: object
      additionalProperties: true
    Permission:
      type: object
      properties:
        roleKey: { type: string }
        resource: { type: string }
        action: { type: string, enum: [view, create, update, approve, delete, export] }
        scope: { type: string, enum: [own, department, all] }
    ExamScheduleItem:
      type: object
      required: [subjectId, date, startTime, endTime]
      properties:
        subjectId: { type: string }
        date: { type: string, format: date }
        startTime: { type: string, example: '09:00' }
        endTime: { type: string, example: '12:00' }
        room: { type: string }
    Exam:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        semester: { type: integer }
        academicYearId: { type: string }
        programId: { type: string }
        status: { type: string, enum: [draft, open, closed] }
        formOpensAt: { type: string, format: date-time }
        formClosesAt: { type: string, format: date-time }
        schedule:
          type: array
          items: { $ref: '#/components/schemas/ExamScheduleItem' }
    ExamForm:
      type: object
      properties:
        _id: { type: string }
        examId: { type: string }
        studentId: { type: string }
        status: { type: string, enum: [draft, pendingPayment, submitted, approved, rejected] }
        feeAmountPaise: { type: integer }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/Ref' }
    HallTicket:
      type: object
      properties:
        _id: { type: string }
        examId: { type: string }
        examFormId: { type: string }
        studentId: { type: string }
        enrollmentNumber: { type: string }
        fullName: { type: string }
        semester: { type: integer }
        seatNumber: { type: string, example: 'S-001' }
        room: { type: string }
        status: { type: string, enum: [pending, issued, blocked] }
        schedule:
          type: array
          items: { $ref: '#/components/schemas/ExamScheduleItem' }
    Payment:
      type: object
      properties:
        _id: { type: string }
        purpose: { type: string, enum: [admission, exam] }
        amountPaise: { type: integer }
        status: { type: string, enum: [created, paid, failed] }
        gateway: { type: string, enum: [razorpay, fake] }
        receiptNumber: { type: string }
        paidAt: { type: string, format: date-time }
  requestBodies:
    Object:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Object' }
    Register:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fullName, email, mobile, password, aadhaarNumber]
            properties:
              fullName: { type: string }
              email: { type: string, format: email }
              mobile: { type: string }
              password: { type: string, format: password }
              aadhaarNumber: { type: string }
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [loginId, password]
            properties:
              loginId: { type: string }
              password: { type: string, format: password }
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [currentPassword, newPassword]
            properties:
              currentPassword: { type: string, format: password }
              newPassword: { type: string, format: password }
    ResetPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, newPassword]
            properties:
              token: { type: string }
              newPassword: { type: string, format: password }
    Permission:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Permission' }
    Exam:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Exam' }
    SubjectSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [subjectIds]
            properties:
              subjectIds:
                type: array
                items: { type: string }
    FormDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [approve]
            properties:
              approve: { type: boolean }
              note: { type: string }
    HallTicketGenerate:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              overwrite: { type: boolean, default: false }
    HallTicketUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              seatNumber: { type: string }
              room: { type: string }
              status: { type: string, enum: [pending, issued, blocked] }
              blockedReason: { type: string }
    PaymentOrder:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [purpose]
            properties:
              purpose: { type: string, enum: [admission, exam] }
              applicationId: { type: string }
              examFormId: { type: string }
    PaymentVerify:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [gatewayPaymentId, gatewayOrderId, gatewaySignature]
            properties:
              gatewayPaymentId: { type: string }
              gatewayOrderId: { type: string }
              gatewaySignature: { type: string }
    Refund:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [paymentId, amountPaise, reason]
            properties:
              paymentId: { type: string }
              amountPaise: { type: integer }
              reason: { type: string }
    RefundDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [approve]
            properties:
              approve: { type: boolean }
              decisionNote: { type: string }
