openapi: 3.0.3
info:
  title: College Integrated MERN Portal API
  version: 1.0.0
  description: |
    API contract for the College Integrated MERN Portal.
    All endpoints are mounted under `/api/v1`. Most endpoints require the
    session cookie `icms.sid`; RBAC scope is derived from the permission matrix.
    Successful JSON responses use `{ success: true, data, meta }`.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: RBAC
  - name: Audit Logs
  - name: Admin Management
  - name: Admissions
  - name: Examinations
  - name: Exam Forms
  - name: Hall Tickets
  - name: Payments
  - name: Refunds
  - name: Timetable
  - name: Attendance
  - name: Marks
  - name: Results
  - name: Teaching Plans
  - name: Students
  - name: Reports
  - name: Website
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Public health check
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register an applicant account
      security: []
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody: { $ref: '#/components/requestBodies/Token' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      security: []
      requestBody: { $ref: '#/components/requestBodies/Email' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and create a session
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the current session
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user and permissions
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      requestBody: { $ref: '#/components/requestBodies/ChangePassword' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody: { $ref: '#/components/requestBodies/Email' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody: { $ref: '#/components/requestBodies/ResetPassword' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }

  /roles:
    get:
      tags: [RBAC]
      summary: List roles
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /roles/{roleKey}:
    get:
      tags: [RBAC]
      summary: Get one role
      parameters: [{ $ref: '#/components/parameters/RoleKey' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /permissions/catalog:
    get:
      tags: [RBAC]
      summary: Get permission catalog
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /permissions:
    get:
      tags: [RBAC]
      summary: List permission matrix rows
      parameters:
        - name: roleKey
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [RBAC]
      summary: Create permission row
      requestBody: { $ref: '#/components/requestBodies/Permission' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /permissions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [RBAC]
      summary: Update permission row
      requestBody: { $ref: '#/components/requestBodies/Permission' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [RBAC]
      summary: Delete permission row
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }

  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit logs
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: action
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }

  /admin/users:
    get:
      tags: [Admin Management]
      summary: List users
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: role
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create user
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update user
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [Admin Management]
      summary: Deactivate user
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/teachers:
    get:
      tags: [Admin Management]
      summary: List teachers
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create teacher
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/teachers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update teacher
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [Admin Management]
      summary: Deactivate teacher
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/departments:
    get:
      tags: [Admin Management]
      summary: List departments
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create department
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/departments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update department
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [Admin Management]
      summary: Deactivate department
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/academic-years:
    get:
      tags: [Admin Management]
      summary: List academic years
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create academic year
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/academic-years/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update academic year
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/programs:
    get:
      tags: [Admin Management]
      summary: List programs
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create program
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/programs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update program
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [Admin Management]
      summary: Deactivate program
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/subjects:
    get:
      tags: [Admin Management]
      summary: List subjects
      parameters:
        - { $ref: '#/components/parameters/ProgramIdQuery' }
        - { $ref: '#/components/parameters/SemesterQuery' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create subject
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/subjects/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update subject
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [Admin Management]
      summary: Deactivate subject
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/fee-structures:
    get:
      tags: [Admin Management]
      summary: List fee structures
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admin Management]
      summary: Create fee structure
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admin/fee-structures/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin Management]
      summary: Update fee structure
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    delete:
      tags: [Admin Management]
      summary: Deactivate fee structure
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }

  /admissions/options:
    get:
      tags: [Admissions]
      summary: Get admission form options
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/subjects:
    get:
      tags: [Admissions]
      summary: Get subject choices for an application context
      parameters:
        - { $ref: '#/components/parameters/ProgramIdQuery' }
        - { $ref: '#/components/parameters/SemesterQuery' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/overdue:
    get:
      tags: [Admissions]
      summary: List overdue applications
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/export:
    get:
      tags: [Admissions]
      summary: Export applications
      parameters: [{ $ref: '#/components/parameters/Format' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications:
    get:
      tags: [Admissions]
      summary: List applications
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admissions]
      summary: Create application
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admissions]
      summary: Get application
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    patch:
      tags: [Admissions]
      summary: Update application
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/pdf:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admissions]
      summary: Download application PDF
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Submit application
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/subjects:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admissions]
      summary: Get application subject choices
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    put:
      tags: [Admissions]
      summary: Save application subject choices
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/subjects/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Approve application subjects
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/documents:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admissions]
      summary: List application documents
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Admissions]
      summary: Upload application document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/documents/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Approve all required documents
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Approve application
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/waitlist:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Waitlist application
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/return:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Return application for correction
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Reject application
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Cancel application
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/hard-copy:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Record hard-copy receipt
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/applications/{id}/student:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Create student from approved application
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/documents/{id}/download:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admissions]
      summary: Download admission document
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/documents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [Admissions]
      summary: Delete admission document
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /admissions/documents/{id}/verify:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admissions]
      summary: Verify admission document
      requestBody: { $ref: '#/components/requestBodies/Object' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }

  /exams:
    get:
      tags: [Examinations]
      summary: List exams
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/AcademicYearIdQuery' }
        - { $ref: '#/components/parameters/ProgramIdQuery' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [Examinations]
      summary: Create exam session
      requestBody: { $ref: '#/components/requestBodies/Exam' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        default: { $ref: '#/components/responses/DefaultError' }
  /exams/available:
    get:
      tags: [Examinations]
      summary: List exams currently open for form submission
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /exams/reference:
    get:
      tags: [Examinations]
      summary: Get scoped reference data for exam administration
      parameters:
        - { $ref: '#/components/parameters/ProgramIdQuery' }
        - { $ref: '#/components/parameters/SemesterQuery' }
      responses:
        '200':
          description: Academic years, programs, and subjects visible to the caller
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          academicYears: { type: array, items: { $ref: '#/components/schemas/Ref' } }
                          programs: { type: array, items: { $ref: '#/components/schemas/Ref' } }
                          subjects: { type: array, items: { $ref: '#/components/schemas/Ref' } }
        default: { $ref: '#/components/responses/DefaultError' }
  /exams/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Examinations]
      summary: Get exam
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
    patch:
      tags: [Examinations]
      summary: Update exam, including schedule
      requestBody: { $ref: '#/components/requestBodies/Exam' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/DefaultError' }
  /exams/{id}/hall-tickets:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Hall Tickets]
      summary: List hall tickets for an exam
      parameters:
        - name: status
          in: query
